name: Deploy Workflow Required - Generador de Estructura

on:
  workflow_dispatch: # Activa el botón manual de fácil acceso en la interfaz web

jobs:
  generate-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que GitHub escriba los archivos por ti
    steps:
    - name: 1. Clonar Repositorio
      uses: actions/checkout@v4

    - name: 2. Generar Estructura Completa de Archivos
      run: |
        # Crear directorios necesarios
        mkdir -p config templates .github/workflows

        # Archivo 1: Plantilla base del minero
        cat << 'EOF' > templates/miner_template.sh
        #!/bin/bash
        echo "============================================="
        echo "🚀 POOL DE MINERÍA ENLAZADO AUTOMÁTICAMENTE"
        echo "============================================="
        POOL_ACTIVO="POOL_URL_REPLACE"
        WALLET_ACTIVA="WALLET_REPLACE"
        echo "🔗 Conectando al Pool: $POOL_ACTIVO"
        echo "💼 Utilizando Wallet: $WALLET_ACTIVA"
        # ./xmrig -o "$POOL_ACTIVO" -u "$WALLET_ACTIVA"
        EOF

        # Archivo 2: Registro de Pools (config/pools.json)
        # Diseñado para cumplir con 'Else/if code no editing' - Solo modificas este JSON para añadir/cambiar
        cat << 'EOF' > config/pools.json
        {
          "pools_disponibles": [
            {
              "nombre": "unmineable_predeterminado",
              "url": "stratum+tcp://unmineable.com:3333",
              "secret_billetera_asociada": "WALLET_BTC_PRINCIPAL"
            },
            {
              "nombre": "binance_pool_respaldo",
              "url": "stratum+tcp://://poolbinance.com",
              "secret_billetera_asociada": "WALLET_BINANCE_MINER"
            }
          ],
          "pool_activo_actual": "unmineable_predeterminado"
        }
        EOF

        # Archivo 3: El Orquestador Final Permanente
        cat << 'EOF' > .github/workflows/orquestador-pools.yml
        name: Orquestador Automatizado de Pools

        on:
          push:
            paths:
              - 'config/pools.json'

        jobs:
          procesar-enlazamiento:
            runs-on: ubuntu-latest
            steps:
            - name: Clonar Repositorio
              uses: actions/checkout@v4

            - name: Leer Pool Activo y Enlazar con Secrets
              id: info_pool
              env:
                WALLET_BTC_PRINCIPAL: ${{ secrets.WALLET_BTC_PRINCIPAL }}
                WALLET_BINANCE_MINER: ${{ secrets.WALLET_BINANCE_MINER }}
              run: |
                POOL_ACTIVO=$(jq -r '.pool_activo_actual' config/pools.json)
                URL_POOL=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .url' config/pools.json)
                SECRET_NAME=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .secret_billetera_asociada' config/pools.json)
                BILLETERA_REAL="${!SECRET_NAME}"
                echo "url_final=$URL_POOL" >> $GITHUB_ENV
                echo "billetera_final=$BILLETERA_REAL" >> $GITHUB_ENV

            - name: Generar Archivo de Minería Final
              run: |
                sed -e "s|POOL_URL_REPLACE|$url_final|g" \
                    -e "s|WALLET_REPLACE|$billetera_final|g" \
                    templates/miner_template.sh > miner_listo.sh
                chmod +x miner_listo.sh

            - name: Publicar Archivo Listo
              uses: actions/upload-artifact@v4
              with:
                name: script-minero-configurado
                path: miner_listo.sh
        EOF

    - name: 3. Guardar cambios en el Repositorio de forma automática
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add config/pools.json templates/miner_template.sh .github/workflows/orquestador-pools.yml
        git commit -m "infrastructure: generar archivos de la arquitectura de pools"
        git push
