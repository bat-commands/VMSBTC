name: Orquestador Automatizado de Pools

on:
  push:
    paths:
      - 'config/pools.json' # Solo se activa si modificas el archivo de pools

jobs:
  procesar-enlazamiento:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Clonar Repositorio
      uses: actions/checkout@v4

    - name: 2. Leer Pool Activo y Enlazar con Secrets
      id: info_pool
      env:
        # Inyectamos TODOS tus secrets de billeteras de forma segura
        WALLET_BTC_PRINCIPAL: ${{ secrets.WALLET_BTC_PRINCIPAL }}
        WALLET_BINANCE_MINER: ${{ secrets.WALLET_BINANCE_MINER }}
      run: |
        # Extraer el pool activo del archivo JSON
        POOL_ACTIVO=$(jq -r '.pool_activo_actual' config/pools.json)
        echo "Pool seleccionado: $POOL_ACTIVO"
        
        # Extraer la URL y el nombre del Secret asociado a ese pool
        URL_POOL=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .url' config/pools.json)
        SECRET_NAME=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .secret_billetera_asociada' config/pools.json)
        
        # Obtener el valor real del Secret usando su nombre dinámico
        BILLETERA_REAL="${!SECRET_NAME}"
        
        # Guardar en variables globales del flujo
        echo "url_final=$URL_POOL" >> $GITHUB_ENV
        echo "billetera_final=$BILLETERA_REAL" >> $GITHUB_ENV

    - name: 3. Generar Archivo de Minería Final Conectado
      run: |
        # Tomar la plantilla y reemplazar las etiquetas por los datos enlazados
        sed -e "s|POOL_URL_REPLACE|$url_final|g" \
            -e "s|WALLET_REPLACE|$billetera_final|g" \
            templates/miner_template.sh > miner_listo.sh
            
        chmod +x miner_listo.sh
        echo "¡Archivo 'miner_listo.sh' recalculado y generado con éxito!"

    - name: 4. Publicar Archivo Listo para Descargar (Artefacto Privado)
      uses: actions/upload-artifact@v4
      with:
        name: script-minero-configurado
        path: miner_listo.sh
