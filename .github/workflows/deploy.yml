name: Deploy Workflow Required - Generador de Estructura

on:
  workflow_dispatch: # Habilita el botón manual de fácil acceso

jobs:
  build-architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 1. Clonar Repositorio en Rama Main
      uses: actions/checkout@v4
      with:
        ref: 'main'

    - name: 2. Generar Archivos con Mapeo de Wallet_BTC y Wallet_BNB
      run: |
        mkdir -p config templates

        # Crear plantilla base del ejecutable
        cat << 'EOF' > templates/miner_template.sh
        #!/bin/bash
        echo "============================================="
        echo "🚀 POOL DE MINERÍA ENLAZADO AUTOMÁTICAMENTE"
        echo "============================================="
        POOL_ACTIVO="POOL_URL_REPLACE"
        WALLET_ACTIVA="WALLET_REPLACE"
        echo "🔗 Conectando al Pool: $POOL_ACTIVO"
        echo "💼 Utilizando Wallet: $WALLET_ACTIVA"
        EOF

        # Crear el JSON centralizado con los nombres exactos de tus Secrets
        cat << 'EOF' > config/pools.json
        {
          "pools_disponibles": [
            {
              "nombre": "unmineable_bitcoin",
              "url": "stratum+tcp://unmineable.com:3333",
              "secret_billetera_asociada": "Wallet_BTC"
            },
            {
              "nombre": "binance_pool_bnb",
              "url": "stratum+tcp://://poolbinance.com",
              "secret_billetera_asociada": "Wallet_BNB"
            }
          ],
          "pool_activo_actual": "unmineable_bitcoin"
        }
        EOF

        # Crear el Orquestador Permanente mapeado a tus Secrets
        cat << 'EOF' > .github/workflows/orquestador-pools.yml
        name: Orquestador Automatizado de Pools
        on:
          push:
            branches:
              - 'main'
            paths:
              - 'config/pools.json'
        jobs:
          procesar-enlazamiento:
            runs-on: ubuntu-latest
            steps:
            - name: Clonar Repositorio
              uses: actions/checkout@v4
              with:
                ref: 'main'

            - name: Vincular Pool Activo con Secrets Especiales
              id: info_pool
              env:
                Wallet_BTC: ${{ secrets.Wallet_BTC }}
                Wallet_BNB: ${{ secrets.Wallet_BNB }}
              run: |
                # 1. Leer el pool configurado en el archivo JSON
                POOL_ACTIVO=$(jq -r '.pool_activo_actual' config/pools.json)
                
                # 2. Extraer los parámetros técnicos (URL y Nombre del Secret requerido)
                URL_POOL=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .url' config/pools.json)
                SECRET_NAME=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .secret_billetera_asociada' config/pools.json)
                
                # 3. Extraer el valor real de la billetera desde las variables de entorno de GitHub
                BILLETERA_REAL="${!SECRET_NAME}"
                
                # 4. Guardar variables globales para el siguiente paso
                echo "url_final=$URL_POOL" >> $GITHUB_ENV
                echo "billetera_final=$BILLETERA_REAL" >> $GITHUB_ENV

            - name: Generar Archivo de Minería Final
              run: |
                sed -e "s|POOL_URL_REPLACE|$url_final|g" \
                    -e "s|WALLET_REPLACE|$billetera_final|g" \
                    templates/miner_template.sh > miner_listo.sh
                chmod +x miner_listo.sh

            - name: Publicar Archivo Listo para Descargar
              uses: actions/upload-artifact@v4
              with:
                name: script-minero-configurado
                path: miner_listo.sh
        EOF

    - name: 3. Guardar Estructura en el Repositorio Remoto
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add config/pools.json templates/miner_template.sh .github/workflows/orquestador-pools.yml
        git commit -m "infrastructure: mapear pools con secrets Wallet_BTC y Wallet_BNB"
        git push origin main
