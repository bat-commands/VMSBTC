name: Deploy Workflow Required - Generador de Estructura

on:
  workflow_dispatch:

# Solución al Exit Code 1: Dar permisos explícitos de escritura al token de GitHub
permissions:
  contents: write

jobs:
  build-architecture:
    runs-on: ubuntu-latest
    steps:
    # Actualizado a checkout@v4 (compatible con Node.js actuales)
    - name: 1. Clonar Repositorio en Rama Main
      uses: actions/checkout@v4
      with:
        ref: 'main'
        fetch-depth: 0 # Trae todo el historial para evitar fallos de Git

    - name: 2. Generar Archivos con Pools Preconfiguradas
      run: |
        mkdir -p config templates

        # Creación de la plantilla del script minero
        cat << 'EOF' > templates/miner_template.sh
        #!/bin/bash
        echo "============================================="
        echo "🚀 POOL DE MINERÍA ENLAZADO AUTOMÁTICAMENTE"
        echo "============================================="
        POOL_ACTIVO="POOL_URL_REPLACE"
        WALLET_ACTIVA="WALLET_REPLACE"
        echo "🔗 Conectando al Pool: $POOL_ACTIVO"
        echo "💼 Utilizando Wallet: $WALLET_ACTIVA"
        EOF

        # Creación del JSON centralizado de pools
        cat << 'EOF' > config/pools.json
        {
          "pools_disponibles": [
            {
              "nombre": "unmineable_bitcoin",
              "url": "stratum+tcp://unmineable.com:3333",
              "secret_billetera_asociada": "Wallet_BTC"
            },
            {
              "nombre": "binance_pool_bnb",
              "url": "stratum+tcp://://poolbinance.com",
              "secret_billetera_asociada": "Wallet_BNB"
            },
            {
              "nombre": "litecoin_pool",
              "url": "stratum+tcp://://poolbinance.com",
              "secret_billetera_asociada": "Wallet_LTC"
            },
            {
              "nombre": "etc_ethermine",
              "url": "strtum+tcp://://2miners.com",
              "secret_billetera_asociada": "Wallet_ETC"
            },
            {
              "nombre": "dogecoin_unmineable",
              "url": "stratum+tcp://://unmineable.com",
              "secret_billetera_asociada": "Wallet_DOGE"
            },
            {
              "nombre": "ravencoin_flypool",
              "url": "stratum+tcp://stratum-ravencoin.flypool.org:3333",
              "secret_billetera_asociada": "Wallet_RVN"
            }
          ],
          "pool_activo_actual": "unmineable_bitcoin"
        }
        EOF

        # Creación del orquestador (pools.yml)
        cat << 'EOF' > .github/workflows/pools.yml
        name: Orquestador Automatizado de Pools
        on:
          push:
            branches:
              - 'main'
            paths:
              - 'config/pools.json'
        jobs:
          procesar-enlazamiento:
            runs-on: ubuntu-latest
            steps:
            - name: Clonar Repositorio
              uses: actions/checkout@v4
              with:
                ref: 'main'

            - name: Vincular Pool Activo con Secrets Especiales
              id: info_pool
              env:
                Wallet_BTC: ${{ secrets.Wallet_BTC }}
                Wallet_BNB: ${{ secrets.Wallet_BNB }}
                Wallet_LTC: ${{ secrets.Secrets.Wallet_LTC }}
                Wallet_ETC: ${{ secrets.Wallet_ETC }}
                Wallet_DOGE: ${{ secrets.Wallet_DOGE }}
                Wallet_RVN: ${{ secrets.Wallet_RVN }}
              run: |
                POOL_ACTIVO=$(jq -r '.pool_activo_actual' config/pools.json)
                URL_POOL=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .url' config/pools.json)
                SECRET_NAME=$(jq -r --arg POOL "$POOL_ACTIVO" '.pools_disponibles[] | select(.nombre==$POOL) | .secret_billetera_asociada' config/pools.json)
                
                BILLETERA_REAL="${!SECRET_NAME}"
                
                echo "url_final=$URL_POOL" >> $GITHUB_ENV
                echo "billetera_final=$BILLETERA_REAL" >> $GITHUB_ENV

            - name: Generar Archivo de Minería Final
              run: |
                sed -e "s|POOL_URL_REPLACE|$url_final|g" \
                    -e "s|WALLET_REPLACE|$billetera_final|g" \
                    templates/miner_template.sh > miner_listo.sh
                chmod +x miner_listo.sh

            - name: Publicar Archivo Listo para Descargar
              uses: actions/upload-artifact@v4
              with:
                name: script-minero-configurado
                path: miner_listo.sh
        EOF

    - name: 3. Guardar Estructura en el Repositorio Remoto
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Añadir archivos de forma segura
        git add config/pools.json templates/miner_template.sh .github/workflows/pools.yml
        
        # Hacer commit sólo si hay cambios reales para evitar errores vacíos
        if ! git diff --cached --quiet; then
          git commit -m "infrastructure: estructurar pools y corregir permisos de escritura"
          git push origin main
        else
          echo "No hay cambios nuevos que guardar."
        fi
